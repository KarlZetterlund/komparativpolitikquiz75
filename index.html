</style></head><body><header><h1>Komparativ Politik: Sverige &amp; USA</h1><p>Danderyds gymnasium · Samhällskunskap 2</p><p>Ansvarig lärare: Karl Zetterlund</p></header><main class="wrap"><section class="panel" id="quiz"><div class="top"><span id="count"></span><span id="points"></span></div><div class="bar" role="progressbar" aria-label="Genomförda frågor" aria-valuemin="0" aria-valuemax="75" aria-valuenow="0" id="progress"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback" aria-live="polite"></div><div class="actions"><button class="action secondary" id="prev" type="button">← Föregående fråga</button><button class="action hidden" id="next">Nästa fråga →</button></div></section><section class="panel hidden" id="result"><div class="summary"><h2>Din resultatsammanställning</h2><div class="score" id="finalscore"></div><p id="percent"></p><p id="comment"></p><div class="actions" style="justify-content:center"><button class="action" id="restart">Starta om quizet</button><button class="action secondary" id="toggleReview">Granska dina svar</button></div></div><div id="review" class="review hidden"></div></section></main><script>
const BANK=[{"id":1,"type":"R","area":"Statsskick","q":"Vilken beskrivning stämmer för Sverige och USA?","opts":["Sverige är en enhetsstat med parlamentarism; USA är en unionsstat med presidentstyre.","Sverige är en unionsstat med presidentstyre; USA är en enhetsstat med parlamentarism.","Sverige är en unionsstat med parlamentarism; USA är en enhetsstat med presidentstyre.","Sverige är en enhetsstat med presidentstyre; USA är en unionsstat med parlamentarism."],"correct":0,"feedback":"Sverige har parlamentarism och nationell yttersta beslutanderätt. USA förenar presidentstyre med delstaternas konstitutionellt skyddade självstyre."},{"id":31,"type":"A","area":"Styrelseskick","q":"Vilken svaghet kan presidentstyre ha när presidenten och kongressens majoritet tillhör olika partier?","opts":["Presidentens förslag kan stoppas i kongressen, så viktiga beslut kan fördröjas.","Presidenten måste automatiskt avgå när kongressen avslår ett lagförslag.","Kongressen förlorar sin rätt att besluta om lagar under presidentens mandatperiod.","Domstolarna måste ta över presidentens uppgifter tills partierna blir överens."],"correct":0,"feedback":"Presidenten och kongressen har var sitt mandat från väljarna. När de är oense kan kongressen stoppa lagförslag, vilket begränsar presidentens makt men också kan leda till politiska låsningar."},{"id":56,"type":"C","area":"Valsystem","q":"I ett land får parti A 40 %, B 30 %, C 20 % och D 10 % av rösterna. Parlamentet har 100 mandat och fördelningen är helt proportionell. Hur många mandat får C?","opts":["20 mandat, eftersom C har 20 procent av rösterna.","10 mandat, eftersom C är tredje största partiet.","30 mandat, eftersom C ingår bland de tre största partierna.","40 mandat, eftersom A är största partiet."],"correct":0,"feedback":"Vid en helt proportionell fördelning motsvarar 20 procent av 100 mandat 20 mandat. Ett partis andel av mandaten ska motsvara dess andel av rösterna."},{"id":2,"type":"A","area":"Valsystem","q":"Vilken nackdel kan ett proportionellt valsystem ha när en regering ska bildas?","opts":["Flera partier kan behöva förhandla länge innan de kan bilda regering.","Det största partiet får automatiskt samtliga platser i parlamentet.","Väljarna måste rösta på en kandidat i varje enskild valkrets.","Regeringen måste avgå varje gång parlamentet röstar om en lag."],"correct":0,"feedback":"Proportionella val gör det lättare för både stora och små partier att få mandat. När inget parti får egen majoritet kan det krävas förhandlingar och kompromisser innan en regering kan bildas."},{"id":32,"type":"A","area":"Valsystem","q":"Varför kan majoritetsval i enmansvalkretsar gynna två stora partier?","opts":["Små partier har svårt att bli störst lokalt och vinna mandat.","Små partier får bara ställa upp i hälften av valkretsarna.","Stora partier tilldelas automatiskt lika många röster överallt.","Stora partier får extra elektorer i alla kongressval."],"correct":0,"feedback":"Eftersom bara valkretsvinnaren får mandat kan små partiers röster ge svag utdelning. Det gör strategisk röstning på större partier mer attraktiv."},{"id":57,"type":"C","area":"Valsystem","q":"I fem enmansvalkretsar får A respektive B följande röstandelar: 42–38, 35–37, 34–33, 31–39 och 38–36 procent. Vilken mandatfördelning får de?","opts":["A får tre mandat och B får två mandat.","A får två mandat och B får tre mandat.","A får fyra mandat och B får ett mandat.","A får fem mandat och B får noll mandat."],"correct":0,"feedback":"A vinner valkrets 1, 3 och 5; B vinner 2 och 4. Varje valkrets ger ett mandat till kandidaten med flest röster."},{"id":3,"type":"R","area":"Statsskick","q":"Vilken roll har Sveriges kung i statsskicket?","opts":["Statschef med främst representativa och symboliska uppgifter.","Regeringschef med ansvar för ministrarnas dagliga arbete.","Riksdagsordförande med ansvar för att lägga fram lagförslag.","Domstolschef med ansvar för prövning av grundlagarna."],"correct":0,"feedback":"Sverige är en konstitutionell monarki. Statsministern leder regeringen medan monarken är statschef utan motsvarande politisk regeringsmakt."},{"id":33,"type":"A","area":"Valsystem","q":"Varför kan proportionella val göra regeringsbildningen svårare?","opts":["Flera partier kan behöva enas om både regering och gemensam politik.","Ett enda parti får automatiskt alla mandat i parlamentet efter valet.","Presidenten måste utse ministrar från samtliga partier i parlamentet.","Alla partier måste rösta likadant i varje fråga under mandatperioden."],"correct":0,"feedback":"I ett proportionellt valsystem får fler partier ofta plats i parlamentet. Om inget parti har majoritet måste partierna förhandla om vilka som ska samarbeta och vilken politik de ska föra."},{"id":58,"type":"C","area":"Valsystem","q":"Parti C får 20 procent av rösterna i hela landet men blir tvåa i samtliga enmansvalkretsar. Vad händer med partiets mandat?","opts":["Partiet får inga mandat trots många röster totalt.","Partiet får 20 procent av mandaten genom nationell utjämning.","Partiet får ett mandat för varje valkrets där det blir tvåa.","Partiet får hälften av mandaten eftersom det alltid är tvåa."],"correct":0,"feedback":"När bara valkretsvinnaren får mandat kan ett parti helt sakna representation trots stor nationell röstandel. Det är en viktig nackdel för mindre partier."},{"id":4,"type":"R","area":"Statsskick","q":"Vad skiljer en unionsstat som USA från en enhetsstat som Sverige?","opts":["I USA har delstaterna egen makt som skyddas i konstitutionen.","I USA kan senaten ensam bestämma vilka lagar delstaterna får ha.","I Sverige har kommunerna egna grundlagar som riksdagen inte kan ändra.","I Sverige får regionerna själva bestämma över landets utrikespolitik."],"correct":0,"feedback":"USA är en unionsstat där delstaternas självstyre skyddas av konstitutionen. Sverige är en enhetsstat där riksdagen ytterst bestämmer vilka befogenheter kommuner och regioner har."},{"id":34,"type":"A","area":"Valsystem","q":"Varför kan ansvarsutkrävandet bli tydligare vid enmansvalkretsar?","opts":["Väljarna vet vilken enskild ledamot som representerar området.","Väljarna kan avsätta presidenten genom varje lokalt val.","Väljarna vet att alla partier representerar området lika mycket.","Väljarna får automatiskt rösta om varje lag som antas."],"correct":0,"feedback":"En enmansvalkrets representeras av en vald ledamot. Missnöjda väljare kan rikta sitt missnöje mot just den personen i nästa val."},{"id":59,"type":"C","area":"Valsystem","q":"I en enmansvalkrets får fyra kandidater 37, 33, 20 respektive 10 procent av rösterna. Vem vinner?","opts":["Kandidaten med 37 procent, eftersom den har fått flest röster.","Kandidaten med 33 procent, eftersom den är näst störst.","Kandidaten med 20 procent, eftersom den har en femtedel av rösterna.","Ingen kandidat, eftersom ingen har fått över 50 procent av rösterna."],"correct":0,"feedback":"Vid majoritetsval i enmansvalkretsar av den typ som används till USA:s representanthus räcker det att få fler röster än varje motkandidat. Vinnaren behöver alltså inte få över hälften av rösterna."},{"id":5,"type":"R","area":"Statsskick","q":"Vad kännetecknar en enhetsstat?","opts":["Den yttersta politiska makten utgår från den nationella nivån.","Delstaternas lagstiftningsmakt är skyddad mot central nivå.","Varje region har en egen konstitution jämställd med statens.","Nationella lagar måste godkännas av varje lokal församling."],"correct":0,"feedback":"Sverige är en enhetsstat med kommunalt och regionalt självstyre. Den yttersta fördelningen av makt bestäms dock nationellt."},{"id":35,"type":"A","area":"Valsystem","q":"Vilken demokratisk styrka kan följa av proportionella val?","opts":["Fler politiska åsikter kan få representation i parlamentet.","Fler politiska åsikter garanteras en egen majoritetsregering.","Fler politiska åsikter slipper följa parlamentets lagar.","Fler politiska åsikter får egna platser i Högsta domstolen."],"correct":0,"feedback":"Mandat efter röstandel ger mindre partier större chans till representation. Det kan öka mångfalden av perspektiv i parlamentet."},{"id":60,"type":"C","area":"Valsystem","q":"Ett land inför proportionella val och flera små partier kommer in i parlamentet. Inget parti får egen majoritet. Vilken följd är rimligast?","opts":["Flera partier kan behöva förhandla om en koalitionsregering.","Det största partiet får automatiskt alla ministerposter och mandat.","Högsta domstolen utser en president med obegränsad mandatperiod.","Alla partier måste avstå från att rösta om budgeten."],"correct":0,"feedback":"Proportionella val kan leda till flerpartisystem. Om ingen har egen majoritet blir samarbete och kompromisser viktiga."},{"id":6,"type":"R","area":"Statsskick","q":"Vad är skillnaden mellan Sveriges riksdag och USA:s kongress?","opts":["Riksdagen har en kammare; kongressen har senaten och representanthuset.","Riksdagen har två kamrar; kongressen har bara representanthuset.","Riksdagen har senaten och representanthuset; kongressen har en kammare.","Riksdagen har en kammare; kongressen har bara senaten som kammare."],"correct":0,"feedback":"Sveriges riksdag har en kammare med 349 ledamöter. USA:s kongress har två kamrar, senaten och representanthuset, som båda deltar när lagar antas."},{"id":36,"type":"A","area":"Parlamentarism och presidentstyre","q":"Vilken fördel kan Sveriges parlamentarism ha jämfört med USA:s presidentstyre när den politiska ledningen förlorar parlamentets stöd?","opts":["Riksdagen kan avsätta statsministern genom misstroende och öppna för en ny regering.","Riksdagen kan automatiskt utlysa presidentval och välja en ny statschef.","Regeringen kan upplösa riksdagen varje gång ett lagförslag röstas ned.","Domstolarna kan ersätta statsministern utan att riksdagen behöver rösta."],"correct":0,"feedback":"I Sverige kan riksdagen rikta misstroende mot statsministern, vilket kan leda till att regeringen avgår. I USA sitter presidenten normalt kvar under sin mandatperiod även om kongressen motsätter sig presidentens politik; ett avsättande genom riksrätt är en annan och mer krävande process."},{"id":61,"type":"C","area":"Valsystem","q":"Väljare i ett distrikt anser att deras enda representant ignorerat en lokal fråga. Vilken möjlighet är särskilt tydlig i systemet?","opts":["Att rösta bort den sittande ledamoten vid nästa val.","Att direkt avsätta samtliga ledamöter i parlamentet.","Att flytta mandatet till ett annat distrikt utan val.","Att automatiskt utse distriktets näst största parti."],"correct":0,"feedback":"Enmansvalkretsar skapar en tydlig koppling mellan ett geografiskt område och en ledamot. Därmed är det lätt att veta vem man ska hålla ansvarig."},{"id":7,"type":"R","area":"Statsskick","q":"Hur är platserna fördelade i USA:s senat?","opts":["Två senatorer från var och en av de 50 delstaterna.","En senator per miljon invånare i varje delstat.","Två senatorer per valkrets i representanthuset.","Hundra senatorer fördelade efter delstaternas folkmängd."],"correct":0,"feedback":"Senaten har 100 ledamöter och varje delstat har två oavsett befolkning. Det ger små delstater större representation per invånare."},{"id":37,"type":"A","area":"Valsystem","q":"Varför kan koalitionsregeringar vara svårare för väljarna att utkräva ansvar av?","opts":["Flera regeringspartier delar på besluten och kompromisserna.","Flera regeringspartier saknar rätt att delta i nationella val.","Flera regeringspartier utses av domstolar i stället för väljare.","Flera regeringspartier får alltid identiska politiska program."],"correct":0,"feedback":"När flera partier förhandlar om politiken kan ansvar för enskilda beslut vara svårt att placera. Samtidigt kan kompromisser inkludera fler väljargrupper."},{"id":62,"type":"C","area":"Statsskick","q":"Två amerikanska delstater har olika regler för skolundervisning, trots att de ingår i samma land. Vilken förklaring passar bäst?","opts":["Unionsstatens uppbyggnad ger delstaterna egen beslutanderätt inom skolområdet.","Presidentstyret ger varje skola rätt att skriva en egen konstitution.","Tvåkammarsystemet gör att senaten beslutar varje skolas schema.","Elektorskollegiet fördelar skolregler efter presidentvalets resultat."],"correct":0,"feedback":"USA:s delstater har självstyre på bland annat skolområdet. Därför kan regler skilja sig mellan delstater."},{"id":8,"type":"R","area":"Statsskick","q":"Hur fördelas delstaternas platser i representanthuset?","opts":["Efter folkmängd, inom ett representanthus med 435 platser.","Lika mellan delstaterna, inom ett representanthus med 100 platser.","Efter delstatens yta, inom ett representanthus med 435 platser.","Efter presidentrösterna, inom ett representanthus med 100 platser."],"correct":0,"feedback":"Representanthuset har 435 ledamöter och delstaternas antal platser beror på folkmängd. Senaten har i stället två ledamöter per delstat."},{"id":38,"type":"A","area":"Statsskick","q":"Varför kan unionsstatens uppbyggnad ge olika regler för invånare i olika delstater?","opts":["Delstaterna har självständig lagstiftningsmakt på vissa områden.","Alla delstater har rätt att upphäva konstitutionen var för sig.","Kongressen förbjuds att stifta lagar som gäller i flera delstater.","Varje delstat har ett eget elektorskollegium som stiftar lagar."],"correct":0,"feedback":"USA:s delstater styr bland annat över delar av skol- och straffrätten. Det möjliggör lokal anpassning men också skillnader i rättigheter och regler."},{"id":63,"type":"C","area":"Statsskick","q":"En liten delstat och en folkrik delstat får vardera två platser i samma kammare. Vilken kammare avses?","opts":["USA:s senat, som ger varje delstat två senatorer.","USA:s representanthus, som ger varje delstat två ledamöter.","Sveriges riksdag, som ger varje region två ledamöter.","USA:s högsta domstol, som ger varje delstat två domare."],"correct":0,"feedback":"I senaten har varje delstat två platser oavsett folkmängd. Representanthusets platser fördelas däremot efter befolkning."},{"id":9,"type":"R","area":"Statsskick","q":"Vad krävs i USA:s kongress för att ett lagförslag ska kunna skickas vidare till presidenten?","opts":["Både senaten och representanthuset måste godkänna samma lagtext.","Senaten måste godkänna lagtexten, men representanthuset behöver inte rösta.","Representanthuset måste godkänna lagtexten, men senaten behöver inte rösta.","Högsta domstolen måste godkänna lagtexten innan kongressen får rösta."],"correct":0,"feedback":"USA:s kongress består av senaten och representanthuset. Båda kamrarna måste godkänna samma lagtext innan förslaget kan skickas till presidenten, som kan skriva under eller lägga in veto."},{"id":39,"type":"A","area":"Statsskick","q":"Vilken möjlig fördel har en enhetsstat vid nationell samordning?","opts":["Den nationella nivån kan lättare skapa gemensamma regler.","Den nationella nivån kan automatiskt avskaffa alla val.","Den nationella nivån måste få varje delstats godkännande.","Den nationella nivån ersätts helt av lokala församlingar."],"correct":0,"feedback":"I en enhetsstat utgår den yttersta makten från central nivå. Det kan underlätta likvärdiga nationella lösningar jämfört med ansvar delat mellan nationell nivå och delstater."},{"id":64,"type":"C","area":"Statsskick","q":"Ett amerikanskt lagförslag godkänns av representanthuset men får nej i senaten. Vad är den direkta följden?","opts":["Förslaget blir inte nationell lag i den föreslagna formen.","Förslaget blir lag eftersom representanthuset har fler ledamöter.","Förslaget blir lag om presidenten utser en extra senator.","Förslaget blir lag när Högsta domstolen registrerar omröstningen."],"correct":0,"feedback":"Båda kamrarna måste godkänna samma text. Senatens nej stoppar förslaget i dess aktuella form."},{"id":10,"type":"R","area":"Styrelseskick","q":"Vad är kärnan i parlamentarism?","opts":["Regeringen måste tolereras av parlamentet för att sitta kvar.","Regeringen väljs alltid direkt av medborgarna i allmänna val.","Regeringen får inte granskas av parlamentets ledamöter.","Regeringen sitter kvar oavsett parlamentets förtroende."],"correct":0,"feedback":"En parlamentarisk regering är beroende av parlamentets tolerans. I Sverige kan riksdagen genom misstroende tvinga fram en avgång."},{"id":40,"type":"A","area":"Statsskick","q":"Varför kombinerar USA:s kongress folkmängd och lika delstatsrepresentation?","opts":["För att balansera stora delstaters befolkning mot små delstaters inflytande.","För att balansera presidentens röster mot domstolarnas röster.","För att balansera kommunernas skatter mot väljarnas primärval.","För att balansera partiernas program mot kandidaternas ålder."],"correct":0,"feedback":"Representanthuset speglar folkmängd medan senaten ger varje delstat två platser. Tvåkammarsystemet bygger på en kompromiss mellan stora och små delstater."},{"id":65,"type":"C","area":"Styrelseskick","q":"I Sverige röstar 174 riksdagsledamöter nej till talmannens statsministerförslag, medan övriga avstår eller röstar ja. Vad händer?","opts":["Kandidaten godkänns eftersom färre än 175 röstar nej.","Kandidaten avslås eftersom minst 174 ledamöter röstar nej.","Kandidaten väljs först om minst 175 ledamöter röstar ja.","Kandidaten utses automatiskt av kungen efter omröstningen."],"correct":0,"feedback":"Negativ parlamentarism innebär att förslaget faller först vid minst 175 nej-röster. Med 174 nej kan kandidaten godkännas."},{"id":11,"type":"R","area":"Styrelseskick","q":"Vad innebär negativ parlamentarism vid statsministerval i Sverige?","opts":["En kandidat godkänns om högst hälften av riksdagen röstar nej.","En kandidat godkänns bara om samtliga partier röstar ja.","En kandidat godkänns om minst hälften av väljarna röstar ja.","En kandidat godkänns bara om kungen röstar ja."],"correct":0,"feedback":"Statsministerförslaget faller om minst 175 av 349 ledamöter röstar nej. Kandidaten behöver alltså inte en egen majoritet av ja-röster."},{"id":41,"type":"A","area":"Statsskick","q":"Vilken nackdel kan USA:s tvåkammarsystem ha när nya lagar ska antas?","opts":["Ett förslag kan stoppas om senaten och representanthuset inte är överens.","Ett förslag kan stoppas om presidenten inte får rösta i representanthuset.","Ett förslag kan stoppas om Högsta domstolen inte väljer senatorerna.","Ett förslag kan stoppas om guvernörerna inte får rösta i senaten."],"correct":0,"feedback":"Både senaten och representanthuset måste godkänna samma lagtext. Det ger fler möjligheter att granska lagar, men kan också fördröja eller stoppa förslag."},{"id":66,"type":"C","area":"Styrelseskick","q":"En amerikansk president förlorar stöd i representanthuset efter ett mellanårsval. Vad gäller normalt för presidentens mandat?","opts":["Presidenten sitter kvar men kan få svårare att genomföra lagförslag.","Presidenten måste avgå eftersom representanthuset röstat om nytt stöd.","Presidenten får automatiskt rätt att upplösa kongressen och utlysa val.","Presidenten ersätts av talmannen så snart majoriteten växlar."],"correct":0,"feedback":"USA:s president har ett eget mandat och avgår inte på grund av ändrad kongressmajoritet. Däremot kan lagstiftningsarbetet blockeras."},{"id":12,"type":"A","area":"Valsystem","q":"Vilken svaghet kan ett proportionellt valsystem ha när en regering ska bildas?","opts":["Flera partier kan behöva kompromissa, vilket kan göra regeringsbildningen långsam.","Ett parti kan vinna alla mandat trots att det får färre röster än motståndarna.","En valkrets kan bli utan ledamot om ingen kandidat får över hälften av rösterna.","En president kan stoppa regeringsbildningen genom att lägga veto mot valresultatet."],"correct":0,"feedback":"Proportionella val gör det lättare för flera partier att få mandat. När inget parti har egen majoritet kan regeringsbildningen kräva långa förhandlingar och kompromisser mellan partierna."},{"id":42,"type":"A","area":"Styrelseskick","q":"Varför kan en svensk regering tvingas avgå utan nytt riksdagsval?","opts":["Riksdagen kan förklara att regeringen saknar dess förtroende.","Högsta domstolen kan välja en ny statsminister vid varje tvist.","Monarken kan byta ut regeringen när opinionsstödet minskar.","Kommunerna kan gemensamt utlysa ett nytt nationellt presidentval."],"correct":0,"feedback":"Parlamentarismen gör regeringen beroende av riksdagens tolerans. Misstroende kan få regeringen att avgå även mellan ordinarie val."},{"id":67,"type":"C","area":"Maktdelning","q":"Presidenten nominerar en domare till Högsta domstolen men senaten vägrar godkänna kandidaten. Vilken princip illustreras?","opts":["Kontroll mellan maktgrenarna mellan verkställande och lagstiftande makt.","Negativ parlamentarism mellan president och representanthus.","Proportionell mandatfördelning mellan domstolar och delstater.","Kommunalt självstyre mellan guvernörer och senatorer."],"correct":0,"feedback":"Presidenten har nomineringsmakten medan senaten prövar utnämningen. Det hindrar presidenten från att ensam tillsätta domare."},{"id":13,"type":"R","area":"Styrelseskick","q":"Vilken roll har Sveriges konstitutionsutskott (KU)?","opts":["Att granska regeringens och ministrarnas tjänsteutövning.","Att nominera domare till USA:s domstolar på nationell nivå.","Att fördela elektorsröster mellan amerikanska delstater.","Att fastställa valkretsgränser till USA:s representanthus."],"correct":0,"feedback":"KU är ett riksdagsutskott som granskar statsrådens tjänsteutövning och regeringsärendenas handläggning. Det är en del av riksdagens kontrollmakt."},{"id":43,"type":"A","area":"Styrelseskick","q":"Varför kan USA:s president sitta kvar när oppositionen vinner kongressen?","opts":["Presidentens mandat är separat och beror inte på kongressens förtroende.","Presidenten får automatiskt en ny mandatperiod när oppositionen vinner.","Presidenten väljs av kongressen och kan inte förlora omröstningar.","Presidenten får upplösa senaten så snart oppositionen får majoritet."],"correct":0,"feedback":"Presidentstyre skiljer den verkställande maktens mandat från kongressens. Det kan skapa delad regeringsmakt och svårare lagstiftning."},{"id":68,"type":"C","area":"Maktdelning","q":"Kongressen antar en lag, presidenten lägger in veto och två tredjedelar i båda kamrarna röstar åter för lagen. Vad sker?","opts":["Kongressen kan åsidosätta vetot och lagen kan träda i kraft.","Presidentens veto gäller alltid oavsett kongressens nya omröstning.","Högsta domstolen måste först utse en ny president.","Senaten får ensam avgöra om lagen ska upphävas."],"correct":0,"feedback":"Presidentens veto är inte absolut. Med två tredjedelar i både senaten och representanthuset kan kongressen köra över vetot."},{"id":14,"type":"A","area":"Statsskick","q":"Vilken nackdel kan USA:s tvåkammarsystem ha jämfört med Sveriges enkammarsystem?","opts":["Ett lagförslag kan stoppas om senaten och representanthuset inte är överens.","Ett lagförslag kan antas utan att någon av kongressens kamrar röstar.","Ett lagförslag måste alltid godkännas av samtliga 50 delstater.","Ett lagförslag måste först antas genom en nationell folkomröstning."],"correct":0,"feedback":"I USA måste både senaten och representanthuset godkänna samma lagförslag. Det ger ytterligare granskning men kan också leda till att beslut fördröjs eller stoppas när kamrarna är oense."},{"id":44,"type":"A","area":"Maktdelning","q":"Vilken styrka och svaghet kan USA:s maktdelning ha samtidigt?","opts":["Domstolar och kongress kan stoppa presidenten, men politiska beslut kan fördröjas.","Presidenten kan styra domstolarna direkt, men delstaterna får fler senatorer.","Kongressen kan avsätta domare efter varje val, men regeringen blir mer stabil.","Senaten kan styra delstatsvalen direkt, men presidenten får färre elektorer."],"correct":0,"feedback":"När maktgrenarna granskar och kan stoppa varandra minskar risken för maktmissbruk. Samtidigt kan oenighet mellan presidenten och kongressen leda till att politiska beslut fastnar."},{"id":69,"type":"C","area":"Maktdelning","q":"Representanthuset röstar för riksrättsåtal mot en president. I senaten röstar 57 av 100 för fällande dom. Vad blir följden?","opts":["Presidenten frias eftersom två tredjedelar krävs för fällande dom.","Presidenten fälls eftersom enkel majoritet räcker i senaten.","Presidenten fälls eftersom representanthuset redan beslutat om åtal.","Presidenten frias eftersom Högsta domstolen måste väcka åtalet."],"correct":0,"feedback":"Detta motsvarar omröstningen vid Trumps andra riksrätt 2021. 57 röster räckte inte eftersom senaten kräver två tredjedelar för fällande dom."},{"id":15,"type":"R","area":"Maktdelning","q":"Vilka institutioner delar på den politiska makten i USA?","opts":["Kongressen stiftar lagar, presidenten styr och domstolarna dömer.","Presidenten stiftar lagar, kongressen dömer och domstolarna styr.","Domstolarna stiftar lagar, kongressen styr och presidenten dömer.","Kongressen styr domstolarna, presidenten dömer och senaten styr ensam."],"correct":0,"feedback":"USA:s maktdelningsprincip skiljer mellan lagstiftande makt i kongressen, verkställande makt hos presidenten och dömande makt hos domstolarna. De tre maktgrenarna kan också begränsa varandra."},{"id":45,"type":"A","area":"Maktdelning","q":"Varför ger livstidsutnämningar till Högsta domstolen långvarigt inflytande?","opts":["En president kan påverka domstolens sammansättning långt efter mandatperioden.","En president kan därmed själv avgöra varje framtida domslut.","En president kan avskaffa senatens godkännande av nya domare.","En president kan förlänga sitt eget ämbete genom domstolens mandat."],"correct":0,"feedback":"Domare nomineras av presidenten och godkänns av senaten men sitter på livstid. Utnämningar kan därför påverka rättstillämpningen under decennier."},{"id":70,"type":"C","area":"Maktdelning","q":"En domstol på nationell nivå stoppar en presidentorder som den bedömer gå utöver presidentens befogenheter. Vilken maktgren har ingripit?","opts":["Den dömande makten begränsar den verkställande makten.","Den lagstiftande makten begränsar den delstatliga makten.","Den verkställande makten begränsar den lagstiftande makten.","Den delstatliga makten begränsar den kommunala makten."],"correct":0,"feedback":"I materialets exempel stoppades Trumps inreseförbud av domstolar på nationell nivå. Domstolsprövning är en motvikt till presidentens makt."},{"id":16,"type":"R","area":"Maktdelning","q":"Vad innebär presidentens veto mot ett lagförslag i USA?","opts":["Presidenten kan stoppa lagen, men kongressen kan rösta igenom den med två tredjedelar i båda kamrarna.","Presidenten kan stoppa lagen, men Högsta domstolen kan rösta igenom den med enkel majoritet.","Presidenten kan stoppa lagen, men senaten kan rösta igenom den med enkel majoritet utan representanthuset.","Presidenten kan stoppa lagen, men delstaternas guvernörer kan rösta igenom den med två tredjedelar."],"correct":0,"feedback":"Ett veto innebär att presidenten säger nej till ett lagförslag som kongressen antagit. Kongressen kan ändå anta lagen om minst två tredjedelar i både senaten och representanthuset röstar för den."},{"id":46,"type":"A","area":"Maktdelning","q":"Varför är två tredjedelar i senaten ett högt hinder vid riksrätt?","opts":["Det krävs ofta stöd även från presidentens eget parti för fällande dom.","Det krävs att alla domare i Högsta domstolen röstar för åtal.","Det krävs att presidenten själv godkänner riksrättsbeslutet.","Det krävs att alla femtio delstatsguvernörer röstar för åtal."],"correct":0,"feedback":"Representanthuset väcker åtal, men senaten behöver två tredjedelar för fällande dom. I Trumps riksrätt 2021 räckte 57 röster för fällande dom inte."},{"id":71,"type":"C","area":"Styrelseskick","q":"Två partier är oense om en viktig lag i USA. Presidentens parti har majoritet i representanthuset men inte i senaten. Vad kan hända?","opts":["Senaten kan stoppa förslaget trots att representanthuset har röstat ja.","Representanthusets ja räcker eftersom presidentens parti styr den kammaren.","Presidenten kan göra förslaget till lag utan att någon kammare godkänner det.","Högsta domstolen måste anta förslaget när kamrarna röstar olika."],"correct":0,"feedback":"Ett lagförslag måste godkännas av både representanthuset och senaten i samma lydelse. Tvåkammarsystemet ger möjlighet till extra granskning, men oenighet kan också förhindra beslut."},{"id":17,"type":"R","area":"Maktdelning","q":"Hur utses domare till USA:s högsta domstol?","opts":["Presidenten nominerar och senaten godkänner kandidaterna.","Representanthuset nominerar och presidenten godkänner kandidaterna.","Delstatsguvernörerna nominerar och väljarna godkänner kandidaterna.","Senaten nominerar och Högsta domstolen godkänner kandidaterna."],"correct":0,"feedback":"Utnämningar visar maktdelning med kontroll mellan maktgrenarna: presidenten föreslår och senaten prövar. Högsta domstolens domare har livstidsförordnanden."},{"id":47,"type":"A","area":"Presidentval","q":"Varför kan kandidaten med flest röster i hela landet förlora USA:s presidentval?","opts":["Elektorer fördelas delstatsvis, ofta med alla till delstatens vinnare.","Elektorer fördelas proportionellt efter varje kandidats nationella röstandel.","Presidenten utses av den partigrupp som får flest senatorer.","Presidenten utses genom en direkt omröstning i representanthuset varje gång."],"correct":0,"feedback":"I de flesta delstater får vinnaren alla delstatens elektorer. Därför kan elektorsresultatet avvika från den nationella röstandelen."},{"id":72,"type":"C","area":"Presidentval","q":"Kandidat A vinner fler röster i USA totalt men kandidat B får 278 elektorer. Vem vinner presidentvalet?","opts":["Kandidat B, eftersom minst 270 elektorer krävs.","Kandidat A, eftersom flest nationella röster alltid avgör.","Kandidat A, eftersom elektorer bara är rådgivande.","Ingen, eftersom minst 300 elektorer krävs för seger."],"correct":0,"feedback":"Elektorskollegiet avgör presidentvalet, inte enbart det nationella röstetalet. 278 elektorer överstiger gränsen 270."},{"id":18,"type":"R","area":"Maktdelning","q":"Vad innebär lagprövning i USA:s högsta domstol?","opts":["Att pröva om lagar och beslut strider mot konstitutionen.","Att avgöra vilka kandidater som får delta i primärvalen.","Att besluta hur skatter på nationell nivå fördelas mellan delstater.","Att anta kongressens budget när kamrarna inte är överens."],"correct":0,"feedback":"Högsta domstolen kan ogiltigförklara grundlagsstridiga lagar och åtgärder. Detta är en central kontroll av de andra maktgrenarna."},{"id":48,"type":"A","area":"Presidentval","q":"Varför satsar kandidater ofta mer på jämna delstater än säkra delstater?","opts":["Små förändringar i jämna delstater kan avgöra många elektorer.","Säkra delstater saknar elektorer och deltar inte i presidentvalet.","Jämna delstater får automatiskt fler elektorer efter varje val.","Säkra delstater röstar bara i primärval och inte i presidentval."],"correct":0,"feedback":"I en vågmästarstat kan en liten röstförskjutning avgöra hela delstatens elektorsgrupp. I en säker delstat är utfallet mindre osäkert."},{"id":73,"type":"C","area":"Presidentval","q":"Ett parti planerar kampanj i två delstater: en där det leder med 25 procentenheter och en där det ligger en procentenhet efter. Varför kan den andra prioriteras?","opts":["En liten förändring kan vända delstatens elektorer till partiets kandidat.","Den andra delstaten får dubbelt så många elektorer när valet är jämnt.","Den första delstaten saknar rösträtt eftersom resultatet verkar säkert.","Den andra delstaten får välja president utan att elektorer räknas."],"correct":0,"feedback":"Vågmästarstater kan byta vinnare vid små röstförändringar. Eftersom delstatens elektorer oftast går till vinnaren blir sådana delstater strategiskt viktiga."},{"id":19,"type":"R","area":"Maktdelning","q":"Vilken roll har representanthuset vid riksrätt på nationell nivå?","opts":["Det beslutar om åtal; senaten håller därefter rättegång.","Det dömer slutligt; presidenten håller därefter rättegång.","Det nominerar domare; Högsta domstolen håller därefter rättegång.","Det utfärdar veto; senaten håller därefter rättegång."],"correct":0,"feedback":"Representanthuset kan väcka riksrättsåtal med enkel majoritet. Senaten prövar anklagelsen och kräver två tredjedelar för fällande dom."},{"id":49,"type":"A","area":"Presidentval","q":"Vilken konsekvens kan följa av att presidentval organiseras delstatsvis?","opts":["Regler för registrering och röstning kan skilja mellan delstater.","Alla väljare använder samma gemensamma nationella registreringsregler utan undantag.","Delstaterna bestämmer själva hur många senatorer de får.","Varje delstat får alltid exakt samma antal elektorsröster."],"correct":0,"feedback":"USA:s delstater administrerar val och kan ha olika regler för registrering och röstning. Unionsstatens uppbyggnad påverkar alltså även förutsättningarna att delta i val."},{"id":74,"type":"C","area":"Demokrati","q":"Ett land håller val med flera partier, men regeringen styr medierna och hindrar oppositionen från att kampanja. Vad är problemet?","opts":["Valen är inte rättvisa eftersom oppositionen inte kan konkurrera på lika villkor.","Valen är rättvisa eftersom det räcker att flera partier står på valsedeln.","Valen är rättvisa eftersom regeringen bestämmer vilka nyheter som publiceras.","Valen är inte rättvisa eftersom alla partier måste få exakt lika många röster."],"correct":0,"feedback":"Att flera partier deltar gör inte automatiskt ett val demokratiskt. Väljare behöver fri information, och oppositionen måste kunna kampanja utan att regeringen hindrar den."},{"id":20,"type":"R","area":"Valsystem","q":"Vad innebär ett proportionellt valsystem?","opts":["Partiernas mandat ska ungefär motsvara deras röstandelar.","Varje valkrets ger sitt enda mandat till största kandidaten.","Största partiet får alla mandat även utan röstmajoritet.","Varje delstat får lika många mandat oavsett folkmängd."],"correct":0,"feedback":"Proportionalitet innebär att exempelvis 20 procent av rösterna ska ge ungefär 20 procent av mandaten. Det underlättar representation för mindre partier."},{"id":50,"type":"A","area":"Demokrati","q":"Varför räcker det inte att ett land håller val för att demokratin ska fungera väl?","opts":["Oppositionen måste kunna delta fritt och medborgarnas rättigheter måste skyddas.","Regeringen måste kunna styra medierna och bestämma vilka partier som får delta.","Domstolarna måste kunna upphäva valresultat när regeringspartiet förlorar.","Det största partiet måste kunna ändra grundlagen utan någon granskning."],"correct":0,"feedback":"Val är en viktig del av demokratin, men konkurrensen måste vara fri och rättvis. Yttrandefrihet, oberoende domstolar och skydd för oppositionen begränsar också makthavarnas möjligheter att missbruka sin makt."},{"id":75,"type":"C","area":"Demokrati","q":"Ett land håller fria val, men regeringen försöker bestämma hur domstolarna ska döma. Vilket problem uppstår?","opts":["Domstolarnas oberoende hotas och regeringen kan bli svårare att granska.","Domstolarnas oberoende stärks när regeringen får bestämma enskilda domar.","Parlamentets rösträtt hotas eftersom domstolarna organiserar alla partival.","Delstaternas självstyre stärks när regeringen kan ändra enskilda domar."],"correct":0,"feedback":"Oberoende domstolar ska kunna bedöma om makthavare följer lagen utan politiska påtryckningar. Om regeringen styr domarna försvagas rättsstaten och skyddet mot maktmissbruk."},{"id":21,"type":"R","area":"Valsystem","q":"Vad innebär majoritetsval i enmansvalkretsar?","opts":["Kandidaten med flest röster får valkretsens enda mandat.","Två kandidater delar mandatet efter sin andel av rösterna.","Alla partier får ett mandat om de passerar en nationell spärr.","Kandidaten med flest röster får alla landets mandat."],"correct":0,"feedback":"I valet till USA:s representanthus får vinnaren i varje enmansvalkrets mandatet. Det krävs inte nödvändigtvis över 50 procent när flera kandidater deltar."},{"id":51,"type":"A","area":"Demokrati","q":"Varför kan oberoende domstolar vara viktiga när ett parti vinner stort?","opts":["De kan skydda rättigheter även mot beslut av en politisk majoritet.","De kan ge majoritetspartiet extra mandat utan något nytt val.","De kan ersätta folkvalda ledamöter med egna domare i parlamentet.","De kan förbjuda minoritetspartier att delta i nästa val."],"correct":0,"feedback":"demokrati med rättighetsskydd handlar också om begränsningar av majoritetsmakten. Domstolarnas oberoende kan skydda grundläggande fri- och rättigheter."},{"id":22,"type":"R","area":"Valsystem","q":"Vilket partisystem tenderar proportionella val att gynna?","opts":["Ett flerpartisystem där även mindre partier kan få mandat.","Ett tvåpartisystem där bara två kandidater får ställa upp.","Ett enpartisystem där största partiet får alla mandat.","Ett opolitiskt system där inga partier tilldelas mandat."],"correct":0,"feedback":"När röstandelar omvandlas till mandat kan fler partier bli representerade. Det bidrar till flerpartisystem och gör koalitioner vanligare."},{"id":52,"type":"A","area":"Demokrati","q":"Två länder har allmän rösträtt. I det ena landet har vissa grupper ändå mycket svårare att påverka politiken. Vad visar jämförelsen?","opts":["Samma rösträtt på papperet betyder inte att alla har lika möjlighet att påverka.","Allmän rösträtt betyder att alla väljare automatiskt får samma politiska inflytande.","Ett land med allmän rösträtt behöver inte skydda mötesfrihet eller yttrandefrihet.","Politiskt inflytande avgörs bara av hur många partier som sitter i parlamentet."],"correct":0,"feedback":"Allmän rösträtt innebär att medborgarna har rätt att rösta enligt samma grundläggande regler. Men faktorer som hot, diskriminering och bristande tillgång till information kan ändå göra det svårare för vissa att delta."},{"id":23,"type":"R","area":"Valsystem","q":"Vad avses med en koalitionsregering?","opts":["En regering där två eller flera partier samarbetar.","En regering där endast ett parti har alla ministerposter.","En regering som leds gemensamt av parlament och domstolar.","En regering som väljs av elektorer i varje delstat."],"correct":0,"feedback":"I ett flerpartisystem kan flera partier behöva bilda regering tillsammans. Samarbetet kräver ofta förhandlingar och kompromisser."},{"id":53,"type":"A","area":"Statsskick","q":"Varför kan ett enkammarsystem göra lagstiftning snabbare än ett tvåkammarsystem?","opts":["Ett beslut behöver inte godkännas av en andra parlamentarisk kammare.","Ett beslut behöver inte följa landets grundlag eller rättigheter.","Ett beslut behöver inte föregås av debatt i den första kammaren.","Ett beslut behöver inte verkställas av regeringen efter omröstningen."],"correct":0,"feedback":"Sverige har en riksdagskammare medan USA:s nationella lagar måste passera två. Färre beslutspunkter kan underlätta beslut men innebär också en kontrollpunkt mindre."},{"id":24,"type":"R","area":"Presidentval","q":"Vid presidentvalet i USA: Hur många elektorer finns totalt, och hur många elektorsröster behöver en kandidat för att vinna?","opts":["538 elektorer totalt och minst 270 för att vinna.","435 elektorer totalt och minst 218 för att vinna.","535 elektorer totalt och minst 268 för att vinna.","100 elektorer totalt och minst 51 för att vinna."],"correct":0,"feedback":"Elektorskollegiet har 538 elektorer. En kandidat behöver minst 270 elektorsröster för att vinna presidentvalet."},{"id":54,"type":"A","area":"Valsystem","q":"Varför kan ett litet parti få stort inflytande i ett proportionellt system?","opts":["Det kan bli avgörande för att flera partier ska nå majoritet tillsammans.","Det kan automatiskt få fler mandat än det största partiet.","Det kan välja samtliga ministrar utan förhandling med andra.","Det kan förbjuda andra partier att rösta i parlamentet."],"correct":0,"feedback":"Om inget parti har majoritet kan ett mindre parti bli vågmästare i regeringsförhandlingar. Dess stöd kan behövas för att bilda eller stödja en regering."},{"id":25,"type":"A","area":"Presidentval","q":"Vilken demokratisk svaghet kan följa av att USA:s president väljs indirekt genom elektorer?","opts":["En kandidat kan vinna presidentposten utan att få flest röster i hela landet.","En kandidat kan väljas av senaten utan att medborgarna deltar i valet.","En kandidat måste vinna majoriteten av rösterna i samtliga delstater.","En kandidat kan bli president enbart genom att vinna flest kongressmandat."],"correct":0,"feedback":"Presidentvalet avgörs av elektorsröster från delstaterna, inte av vem som fått flest röster i landet totalt. Därför kan den nationella röstandelen och valresultatet peka åt olika håll."},{"id":55,"type":"A","area":"Maktdelning","q":"Vad visar domstolarnas möjlighet att stoppa en presidentorder?","opts":["Den verkställande makten begränsas av en självständig dömande makt.","Den dömande makten ersätter kongressen i alla budgetbeslut.","Den verkställande makten kan upphäva konstitutionen genom order.","Den lagstiftande makten utser presidenten efter varje domstolsbeslut."],"correct":0,"feedback":"I materialets fall om Trumps inreseförbud stoppade domstolar på nationell nivå presidentorder. Domstolsprövning är ett konkret exempel på maktdelning."},{"id":26,"type":"R","area":"Presidentval","q":"Vad menas med en vågmästarstat?","opts":["En delstat där presidentvalet är jämnt och kan bli avgörande.","En delstat där samma parti alltid vinner med stor marginal.","En delstat där alla elektorer fördelas proportionellt nationellt.","En delstat där guvernören utser presidenten utan folkomröstning."],"correct":0,"feedback":"I jämna delstater kan små röstförändringar flytta många elektorer. Därför koncentrerar presidentkandidater ofta kampanjer dit."},{"id":27,"type":"A","area":"Parlamentarism och presidentstyre","q":"Vilken konsekvens kan det få att USA har presidentstyre medan Sverige har parlamentarism?","opts":["USA:s president kan sitta kvar trots motstånd i kongressen, medan Sveriges regering kan tvingas avgå efter misstroende i riksdagen.","USA:s president måste avgå om senaten röstar emot ett lagförslag, medan Sveriges regering alltid sitter kvar till nästa val.","USA:s president utses av kongressen efter varje val, medan Sveriges statsminister väljs direkt av medborgarna.","USA:s president kan ensam besluta om alla lagar, medan Sveriges regering måste få varje lag godkänd av domstolarna."],"correct":0,"feedback":"I presidentstyre har presidenten ett eget mandat och behöver inte kongressens löpande förtroende för att sitta kvar. I svensk parlamentarism kan riksdagen däremot tvinga bort statsministern eller en minister genom en misstroendeförklaring."},{"id":28,"type":"R","area":"Demokrati","q":"Ett land håller flerpartival, men oppositionen hindras och medierna kontrolleras av regeringen. Vilken bedömning är mest rimlig?","opts":["Val förekommer, men konkurrensen är så begränsad att demokratin brister.","Val förekommer, och det räcker för att landet ska vara demokratiskt.","Val förekommer, men landet saknar därför helt politiska institutioner.","Val förekommer, och oppositionens villkor saknar betydelse för demokratin."],"correct":0,"feedback":"Att hålla val räcker inte om oppositionen hindras från att konkurrera på rättvisa villkor. Väljarnas möjlighet att byta makthavare måste vara verklig."},{"id":29,"type":"R","area":"Demokrati","q":"Varför är oberoende domstolar och grundläggande friheter viktiga även i ett land som håller fria val?","opts":["De begränsar maktmissbruk och skyddar människor också mellan valen.","De ersätter folkvalda församlingar när politiska beslut ska fattas.","De ger regeringen möjlighet att förbjuda opposition inför valen.","De gör att domstolarna automatiskt bestämmer valens mandatfördelning."],"correct":0,"feedback":"Demokrati handlar också om rättsstat och skydd för individens fri- och rättigheter. Oberoende domstolar kan granska makthavare även när dessa har vunnit val."},{"id":30,"type":"R","area":"Demokrati","q":"Vad kännetecknar representativ demokrati?","opts":["Medborgarna väljer företrädare som fattar politiska beslut.","Medborgarna röstar själva om varje enskild nationell lag.","Domstolarna väljer företrädare som fattar politiska beslut.","Regeringen utser väljare som fattar politiska beslut."],"correct":0,"feedback":"I representativ demokrati utövas folkstyret genom valda företrädare. Både Sveriges riksdag och USA:s kongress bygger på denna princip."}];
const ABC=['A','B','C','D'];let order=[],index=0,score=0,history=[],locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=[BANK[0],...shuffle(BANK.slice(1))].map(q=>({...q,shown:shuffle(q.opts.map((text,i)=>({text,correct:i===q.correct})))}));index=0;score=0;history=[];$('result').classList.add('hidden');$('review').classList.add('hidden');$('toggleReview').textContent='Granska dina svar';$('quiz').classList.remove('hidden');render();window.scrollTo({top:0,behavior:'instant'})}
function render(){const q=order[index],h=history[index];locked=!!h;$('count').textContent=`Fråga ${index+1} av 75`;$('points').textContent=`${score} rätt hittills`;$('progress').setAttribute('aria-valuenow',history.length);$('fill').style.width=(history.length/75*100)+'%';$('question').textContent=q.q;$('prev').disabled=index===0;$('answers').replaceChildren();q.shown.forEach((o,i)=>{const b=document.createElement('button');b.className='option';b.type='button';const letter=document.createElement('span');letter.className='letter';letter.textContent=ABC[i];const label=document.createElement('span');label.textContent=o.text;b.append(letter,label);if(h){b.disabled=true;if(o.correct)b.classList.add('correct');else if(i===h.chosen)b.classList.add('wrong')}else b.addEventListener('click',()=>answer(i));$('answers').append(b)});if(h){$('feedback').replaceChildren();const lead=document.createElement('strong');lead.textContent=h.ok?'Rätt svar!':'Inte riktigt – se förklaringen:';const desc=document.createElement('span');desc.textContent=q.feedback;$('feedback').append(lead,desc);$('feedback').classList.remove('hidden');$('next').textContent=index===74?'Visa resultat →':'Nästa fråga →';$('next').classList.remove('hidden')}else{$('feedback').classList.add('hidden');$('next').classList.add('hidden')}}
function answer(chosen){if(locked)return;locked=true;const q=order[index],ok=q.shown[chosen].correct;if(ok)score++;history[index]={q,chosen,ok};[...$('answers').children].forEach((b,i)=>{b.disabled=true;if(q.shown[i].correct)b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});$('points').textContent=`${score} rätt hittills`;$('feedback').replaceChildren();const lead=document.createElement('strong');lead.textContent=ok?'Rätt svar!':'Inte riktigt – se förklaringen:';const desc=document.createElement('span');desc.textContent=q.feedback;$('feedback').append(lead,desc);$('feedback').classList.remove('hidden');$('next').textContent=index===74?'Visa resultat →':'Nästa fråga →';$('next').classList.remove('hidden');$('next').focus()}
$('prev').addEventListener('click',()=>{if(index>0){index--;render()}});$('next').addEventListener('click',()=>{if(!locked)return;index++;if(index===75)finish();else render()});
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalscore').textContent=`${score} / 75`;$('percent').textContent=`${Math.round(score/75*100)} % rätt`;$('comment').textContent='Gå igenom frågorna du var osäker på och läs förklaringarna. Resultatet är repetitionsstöd, inte ett betyg.';const root=$('review');root.replaceChildren();history.forEach((h,i)=>{const div=document.createElement('article');div.className='reviewitem';const title=document.createElement('strong');title.textContent=`${i+1}. ${h.q.q}`;const selected=document.createElement('p');selected.className=h.ok?'ok':'bad';selected.textContent=`Ditt svar: ${ABC[h.chosen]}. ${h.q.shown[h.chosen].text} ${h.ok?'✓':'✗'}`;const correct=document.createElement('p');correct.textContent='Rätt svar: '+h.q.shown.find(x=>x.correct).text;const explanation=document.createElement('p');explanation.className='muted';explanation.textContent=h.q.feedback;div.append(title,selected,correct,explanation);root.append(div)});window.scrollTo({top:0,behavior:'instant'})}
$('restart').addEventListener('click',start);$('toggleReview').addEventListener('click',()=>{const hidden=$('review').classList.toggle('hidden');$('toggleReview').textContent=hidden?'Granska dina svar':'Dölj genomgången'});start();
</script></body></html>
